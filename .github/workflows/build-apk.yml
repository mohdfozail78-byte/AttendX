
name: Build AttendX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Find Flutter project
        run: |
          echo "Repository files:"
          ls -la

          mkdir -p attendx_project

          unzip -q AttendX_GitHub_Flutter_MVP.zip -d attendx_project

          echo "Extracted files:"
          find attendx_project -maxdepth 3 -type f | head -100

      - name: Locate pubspec.yaml
        run: |
          PUBSPEC=$(find attendx_project -name pubspec.yaml -type f | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendX-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
