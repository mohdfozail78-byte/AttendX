name: Build AttendX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AttendX Flutter project
        run: |
          mkdir attendx_project
          unzip -q AttendX_GitHub_Flutter_MVP_FIXED.zip -d attendx_project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project wrapper
        working-directory: attendx_project
        run: |
          flutter create . --platforms=android --project-name attendx

      - name: Get Flutter dependencies
        working-directory: attendx_project
        run: flutter pub get

      - name: Build release APK
        working-directory: attendx_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendX-APK
          path: attendx_project/build/app/outputs/flutter-apk/app-release.apk
